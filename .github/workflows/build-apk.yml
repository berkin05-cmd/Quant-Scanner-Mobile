name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Sistem paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython==3.0.11"
          python -m pip install "buildozer==1.5.0"

      - name: Eski derlemeyi temizle
        working-directory: android
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: APK olustur
        working-directory: android
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          buildozer -v android debug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: Quant-Scanner-Mobile-APK
          path: android/bin/*.apk
          if-no-files-found: error
